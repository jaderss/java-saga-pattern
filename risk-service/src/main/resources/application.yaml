server:
  port: ${PORT:8083}

spring:
  application:
    name: risk-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/risk
    username: risk
    password: ${DB_PASSWORD:risk}
  jooq:
    sql-dialect: postgres
  flyway:
    locations: classpath:db/messaging,classpath:db/participant,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        group.instance.id: ${KAFKA_INSTANCE_ID:${spring.application.name}-${HOSTNAME:${random.uuid}}}
  mvc:
    problemdetails:
      enabled: true

risk:
  daily-limit: ${RISK_DAILY_LIMIT:5000.00}

participant:
  step-latency: ${STEP_LATENCY:0ms}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  pattern:
    level: "%5p [%X{sagaId:-}]"
  level:
    org.jooq: INFO
    org.jooq.tools.LoggerListener: INFO

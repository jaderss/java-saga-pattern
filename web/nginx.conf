server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $account http://account-service:8080;
    set $risk http://risk-service:8080;
    set $transfer http://transfer-service:8080;

    location /api/accounts { proxy_pass $account; }
    location /api/limits { proxy_pass $risk; }

    location ~ ^/api/transfers/[^/]+/stream$ {
        proxy_pass $transfer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    location /api/ { proxy_pass $transfer; }

    location / { try_files $uri /index.html; }
}

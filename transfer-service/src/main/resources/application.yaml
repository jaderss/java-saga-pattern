server:
  port: ${PORT:8081}

spring:
  application:
    name: transfer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/transfer
    username: transfer
    password: ${DB_PASSWORD:transfer}
  flyway:
    locations: classpath:db/messaging,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        group.instance.id: ${KAFKA_INSTANCE_ID:${spring.application.name}-${HOSTNAME:${random.uuid}}}
  mvc:
    problemdetails:
      enabled: true
    async:
      request-timeout: 15m

saga:
  step-timeout: ${SAGA_STEP_TIMEOUT:3s}
  max-backoff: ${SAGA_MAX_BACKOFF:24s}
  max-attempts: ${SAGA_MAX_ATTEMPTS:3}
  timeout-batch: 20
  park-on-failure: 1m
  approval-timeout: ${SAGA_APPROVAL_TIMEOUT:2m}
  timeout-scan-interval: 250ms

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  pattern:
    level: "%5p [%X{sagaId:-}]"
